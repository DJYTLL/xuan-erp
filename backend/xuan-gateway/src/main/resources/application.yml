server:
  port: 8100

spring:
  profiles:
    default: dev
  application:
    name: xuan-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: xuan-iam
              uri: lb://xuan-iam
              predicates:
                - Path=/api/iam/**,/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info

xuan:
  gateway:
    security:
      enabled: true
      issuer: xuan-iam
      audience: xuan-gateway
      iam-service-name: xuan-iam
