server:
  port: 8100

spring:
  profiles:
    default: dev
  application:
    name: xuan-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: xuan-iam
              uri: lb://xuan-iam
              predicates:
                - Path=/api/iam/**,/.well-known/jwks.json,/v3/api-docs/iam
              filters:
                - RewritePath=/v3/api-docs/iam,/v3/api-docs
            - id: xuan-audit
              uri: lb://xuan-audit
              predicates:
                - Path=/api/audit/**
            - id: xuan-tenant
              uri: lb://xuan-tenant
              predicates:
                - Path=/api/tenants,/api/tenants/**,/api/tenant-plans,/api/tenant-plans/**,/api/tenant-plan-assignments,/api/tenant-plan-assignments/**,/api/tenant-provision-tasks/**,/api/tenant-outbox-events/**,/v3/api-docs/tenant
              filters:
                - RewritePath=/v3/api-docs/tenant,/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

xuan:
  gateway:
    security:
      enabled: true
      issuer: xuan-iam
      audience: xuan-gateway
      iam-service-name: xuan-iam
      public-paths:
        - /actuator/health
        - /actuator/health/**
        - /actuator/info
        - /v3/api-docs
        - /v3/api-docs/**
        - /swagger-ui.html
        - /swagger-ui/**
        - /webjars/**
        - /api/iam/auth/login
        - /api/iam/auth/refresh
        - /.well-known/jwks.json
      cors:
        allowed-origins:
          - http://127.0.0.1:5173
          - http://localhost:5173
        allowed-methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        allowed-headers:
          - '*'
        exposed-headers:
          - Authorization
          - Content-Disposition
        allow-credentials: true
        max-age: 1800
