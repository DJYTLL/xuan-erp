server:
  port: 8100

spring:
  profiles:
    default: dev
  application:
    name: xuan-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: xuan-iam
              uri: lb://xuan-iam
              predicates:
                - Path=/api/iam/**,/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info

xuan:
  gateway:
    security:
      enabled: true
      issuer: xuan-iam
      audience: xuan-gateway
      iam-service-name: xuan-iam
      cors:
        allowed-origins:
          - http://127.0.0.1:5173
          - http://localhost:5173
        allowed-methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        allowed-headers:
          - '*'
        exposed-headers:
          - Authorization
          - Content-Disposition
        allow-credentials: true
        max-age: 1800
