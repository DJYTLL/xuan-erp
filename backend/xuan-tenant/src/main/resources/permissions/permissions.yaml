service: xuan-tenant
draft: true
permissions:
  - code: tenant:view
    resource: tenant
    action: view
    templateAction: view
    note: 查询租户列表、详情和生命周期摘要
  - code: tenant:create
    resource: tenant
    action: create
    templateAction: create
    note: 创建租户并触发初始化流程
  - code: tenant:update
    resource: tenant
    action: update
    templateAction: update
    note: 修改租户基础信息
  - code: tenant-domain:view
    resource: tenant-domain
    action: view
    templateAction: view
    note: 查看租户域名、验证状态和主域名信息
  - code: tenant-domain:manage
    resource: tenant-domain
    action: manage
    templateAction: edit
    note: 当前聚合租户域名创建、编辑、验证和删除写操作
  - code: tenant-contact:view
    resource: tenant-contact
    action: view
    templateAction: view
    note: 查看租户联系人、主联系人标记和联系方式
  - code: tenant-contact:manage
    resource: tenant-contact
    action: manage
    templateAction: edit
    note: 当前聚合租户联系人创建、编辑和删除写操作
  - code: tenant:delete
    resource: tenant
    action: delete
    templateAction: delete
    note: 删除租户且必须填写删除原因
  - code: tenant:enable
    resource: tenant
    action: enable
    templateAction: enable
    note: 启用或恢复租户
  - code: tenant:disable
    resource: tenant
    action: disable
    templateAction: disable
    note: 暂停、停用或冻结租户，必须填写原因
  - code: tenant-config:view
    resource: tenant-config
    action: view
    templateAction: view
    note: 查看租户配置和公开配置
  - code: tenant-config:manage
    resource: tenant-config
    action: manage
    templateAction: edit
    note: 当前聚合租户配置创建、编辑和删除，后续可按统一模板受控细分
  - code: tenant-plan:view
    resource: tenant-plan
    action: view
    templateAction: view
    note: 查看租户套餐、套餐详情和套餐分配记录
  - code: tenant-plan:manage
    resource: tenant-plan
    action: manage
    templateAction: edit
    note: 创建、修改、启用、停用和删除租户套餐
  - code: tenant-plan:assign
    resource: tenant-plan-assignment
    action: assign
    templateAction: edit
    note: 创建、修改和删除租户套餐分配关系
