<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel 资源规则检查处理流程</title>
  <desc id="desc">用户请求访问资源，Sentinel 根据规则检查是否违反。未违反则放行并结束，违反则抛出异常，如果配置了兜底处理则执行 fallback 后结束，否则返回默认错误。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563" />
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#111827" flood-opacity="0.16" />
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .line { stroke: #4b5563; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #111827; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #475569; }
      .branch { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #d97706; }
      .white { fill: #ffffff; }
      .purple { fill: #6d4bb3; }
      .green { fill: #059669; }
      .red { fill: #dc2626; }
      .circle { fill: #e5e7eb; stroke: #94a3b8; stroke-width: 3; }
      .box { rx: 12; filter: url(#shadow); }
      .diamond { filter: url(#shadow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="760" rx="28" />
  <text class="label" x="490" y="58" text-anchor="middle">Sentinel 资源规则检查处理流程</text>

  <circle class="circle" cx="120" cy="135" r="52" />
  <text class="label" x="120" y="126" text-anchor="middle">用户</text>
  <text class="small" x="120" y="156" text-anchor="middle">请求</text>

  <rect class="box purple" x="265" y="91" width="210" height="76" />
  <text class="label white" x="370" y="139" text-anchor="middle">资源</text>

  <rect class="box green" x="285" y="238" width="170" height="76" />
  <text class="label white" x="370" y="286" text-anchor="middle">规则</text>

  <rect class="box" x="520" y="187" width="240" height="58" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3" />
  <text class="small" x="640" y="224" text-anchor="middle">Sentinel 检查</text>

  <polygon class="diamond purple" points="370,377 455,462 370,547 285,462" />
  <text class="label white" x="370" y="454" text-anchor="middle">违反</text>
  <text class="label white" x="370" y="488" text-anchor="middle">规则?</text>

  <rect class="box green" x="82" y="454" width="135" height="64" />
  <text class="label white" x="150" y="495" text-anchor="middle">放行</text>

  <rect class="box red" x="720" y="454" width="170" height="64" />
  <text class="label white" x="805" y="495" text-anchor="middle">抛出异常</text>

  <polygon class="diamond purple" points="805,568 890,653 805,738 720,653" />
  <text class="label white" x="805" y="645" text-anchor="middle">兜底</text>
  <text class="label white" x="805" y="679" text-anchor="middle">处理?</text>

  <rect class="box green" x="455" y="622" width="220" height="64" />
  <text class="label white" x="565" y="663" text-anchor="middle">执行 fallback</text>

  <rect class="box red" x="710" y="684" width="190" height="64" />
  <text class="label white" x="805" y="725" text-anchor="middle">默认错误</text>

  <circle class="circle" cx="120" cy="653" r="48" />
  <text class="label" x="120" y="663" text-anchor="middle">结束</text>

  <path class="line" d="M 172 135 L 258 135" />
  <path class="line" d="M 370 167 L 370 231" />
  <path class="line-soft" d="M 455 276 L 560 246" />
  <path class="line" d="M 370 314 L 370 371" />

  <path class="line" d="M 285 462 L 150 462 L 150 447 L 150 454" />
  <text class="branch" x="204" y="432" text-anchor="middle">否</text>

  <path class="line" d="M 455 462 L 805 462 L 805 448 L 805 454" />
  <text class="branch" x="622" y="432" text-anchor="middle">是</text>

  <path class="line" d="M 150 518 L 150 604" />
  <path class="line" d="M 805 518 L 805 561" />

  <path class="line" d="M 720 653 L 682 653" />
  <text class="branch" x="704" y="624" text-anchor="middle">有</text>
  <path class="line" d="M 455 653 L 170 653" />

  <path class="line" d="M 805 738 L 805 676 L 805 684" />
  <text class="branch" x="840" y="688">无</text>
  <path class="line" d="M 710 716 L 170 716 L 170 678" />
</svg>
